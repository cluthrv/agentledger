[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-ledger"
version = "0.1.0"
description = "Cryptographic audit trails for AI agent operations: SHA-256 hash chains and Merkle trees. Python port of the TypeScript @vluthra/agent-ledger, producing identical hashes and roots for cross-language verification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vikas Luthra" }]
keywords = ["ai", "agents", "audit", "provenance", "merkle", "hash-chain", "tamper-evident", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cluthrv/agentledger"
Repository = "https://github.com/cluthrv/agentledger"
"npm (TypeScript)" = "https://www.npmjs.com/package/@vluthra/agent-ledger"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentledger"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vluthra-agent-ledger"
version = "0.2.0"
description = "Tamper-evident audit trails for AI agent tool calls: SHA-256 hash chains and Merkle trees. Python port of the npm package @vluthra/agent-ledger, with identical hashes and roots across languages."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vikas Luthra" }]
keywords = ["ai", "agents", "audit", "provenance", "merkle", "hash-chain", "tamper-evident", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cluthrv/agentledger"
Repository = "https://github.com/cluthrv/agentledger"
Documentation = "https://github.com/cluthrv/agentledger/tree/main/python#readme"
Changelog = "https://github.com/cluthrv/agentledger/releases"
"npm (TypeScript)" = "https://www.npmjs.com/package/@vluthra/agent-ledger"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentledger"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
